spring:
  application:
    name: workflow
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:9092
  datasource:
    url: jdbc:postgresql://postgres:5432/workflowdb
    username: workflow
    password: workflow
  jpa:
    hibernate:
      ddl-auto: update